name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ver="${GITHUB_SHA::7}"
          go build -trimpath -ldflags="-s -w -X main.version=${ver}" \
            -o "dist/aos-linux-${{ matrix.goarch }}" ./cmd/aos
          (cd dist && sha256sum "aos-linux-${{ matrix.goarch }}" > "aos-linux-${{ matrix.goarch }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: aos-linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
