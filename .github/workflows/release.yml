name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build linux binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          ver="${GITHUB_REF_NAME:-v0.3.0}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${ver}" \
              -o "dist/aos-linux-${arch}" ./cmd/aos
          done
          (cd dist && sha256sum aos-linux-* > SHA256SUMS)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/aos-linux-amd64
            dist/aos-linux-arm64
            dist/SHA256SUMS
