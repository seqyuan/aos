<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aos</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --code-bg: #f6f8fa;
      --link: #0969da;
      --heading: #1f2328;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --code-bg: #161b22;
        --link: #58a6ff;
        --heading: #e6edf3;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      gap: 16px;
      align-items: baseline;
      flex-wrap: wrap;
    }
    header a { color: var(--link); text-decoration: none; }
    header a:hover { text-decoration: underline; }
    header .brand { font-weight: 650; color: var(--heading); text-decoration: none; font-size: 18px; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 24px 64px; }
    h1, h2, h3 { color: var(--heading); line-height: 1.25; }
    h1 { font-size: 2em; margin: 0 0 0.8em; }
    h2 { font-size: 1.4em; margin-top: 2em; padding-top: 0.4em; border-top: 1px solid var(--border); }
    h3 { font-size: 1.15em; }
    a { color: var(--link); }
    p, li { color: var(--fg); }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
      background: var(--code-bg);
      padding: 0.15em 0.4em;
      border-radius: 4px;
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow: auto;
    }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    th { background: var(--code-bg); }
    footer {
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="./">aos</a>
    <a href="https://github.com/seqyuan/aos">GitHub</a>
    <a href="https://github.com/seqyuan/aos/releases">下载</a>
  </header>
  <main class="wrap">
    {{CONTENT}}
  </main>
  <footer>aos 说明文档 · 由 README 自动生成</footer>
</body>
</html>
